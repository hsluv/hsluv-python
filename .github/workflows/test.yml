name: Run the Test Suite

on:
  pull_request:
  push:
  schedule:
    - cron: '0 16 * * 5'  # Every Friday 4pm
  workflow_dispatch:

jobs:
  run_test_suite:
    strategy:
      matrix:
        python-version: [3.11, 3.15]  # no current need for in-between versions
    name: Run the Test Suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the Test Suite
        run: |-
          set -x
          python -m pip install build pytest
          python -m build
          cd dist/
          tar xf hsluv-*.tar.gz
          cd hsluv-*/
          python -m pip install .
          pytest -v tests/
          cd ..
          python -m pip install --force-reinstall hsluv-*.whl
          python -c 'import hsluv; from importlib.metadata import version; assert hsluv.__version__ == version("hsluv")'
          python -m unittest discover -s hsluv-*/tests -v
