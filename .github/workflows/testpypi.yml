name: Publish to TestPyPI
on: workflow_dispatch
permissions: {contents: read}
jobs:
  build:
    if: github.repository == 'hsluv/hsluv-python' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.11'}
      - run: python -m pip install build
      - run: python -m unittest discover -v
      - run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: distributions, path: dist/}
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: distributions, path: dist/}
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with: {repository-url: 'https://test.pypi.org/legacy/'}
