[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "hsluv"
dynamic = ["version"]
description = "Human-friendly HSL"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Robert McGinley", email = "mcginleyr1@gmail.com"},
    {name = "Alexei Boronine", email = "alexei@boronine.com"},
    {name = "Sebastian Pipping", email = "sebastian@pipping.org"},
]
requires-python = ">=3.11"
keywords = ["color", "hsl", "cie", "cieluv", "colorwheel", "hsluv", "hpluv"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://www.hsluv.org"
"Bug Tracker" = "https://github.com/hsluv/hsluv-python/issues"
"Source Code" = "https://github.com/hsluv/hsluv-python"

[tool.setuptools]
py-modules = ["hsluv"]

[tool.setuptools.dynamic]
version = {attr = "hsluv.__version__"}
